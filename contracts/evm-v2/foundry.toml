[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 1
via_ir = true

# This package intentionally has no external dependencies. The tests use a
# small local Vm interface so `forge test` works in an offline checkout.

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 64
fail_on_revert = true
