[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 1
via_ir = true

# This package intentionally has no external dependencies. Suite tests deploy
# production artifacts through a small local Vm interface.

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 64
fail_on_revert = true
