name: ci

on:
  # Buildable source trees and repository acceptance fixtures gate CI. Changes
  # limited to web/ or docs/ do not start this workflow.
  push:
    branches: [main, master]
    paths:
      - "cli/**"
      - "contracts/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "cli/**"
      - "contracts/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"

jobs:
  contract:
    name: contract (rust 1.81)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/repo-registry
    steps:
      - uses: actions/checkout@v5

      # 1.81.0 is mandatory: Injective's CosmWasm VM rejects wasm built by
      # 1.82+ (reference-types) / 1.87+ (bulk-memory). Cargo.lock pins the
      # matching dependency versions - do NOT run a bare `cargo update`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81.0
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/repo-registry

      - name: unit + integration tests
        run: cargo test --locked

      - name: build wasm artifact
        run: cargo build --release --target wasm32-unknown-unknown --lib --locked

      - name: verify Rust toolchain and wasm artifact
        run: |
          set -euo pipefail
          rustc --version | grep -Eq '^rustc 1\.81\.'
          f=target/wasm32-unknown-unknown/release/repo_registry.wasm
          test -s "$f"
          magic="$(od -An -tx1 -N4 "$f" | tr -d '[:space:]')"
          test "$magic" = "0061736d"

      - uses: actions/upload-artifact@v6
        with:
          name: repo_registry.wasm
          path: contracts/repo-registry/target/wasm32-unknown-unknown/release/repo_registry.wasm

  cli:
    name: cli (go 1.22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          # zero-dependency module: no go.sum to key a cache on
          cache: false

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # Cross-compile the igit toolchain (igit + git-remote-igit) for every
      # supported platform; pure-Go zero-dependency module, so CGO stays off.
      - name: build toolchain matrix
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            out="dist/igit-${os}-${arch}"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w" -o "$out/igit${ext}" ./cmd/igit
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w" -o "$out/git-remote-igit${ext}" ./cmd/git-remote-igit
          done

      - uses: actions/upload-artifact@v6
        with:
          name: igit-toolchain
          path: cli/dist/
          if-no-files-found: error

  acceptance-fixtures:
    name: acceptance fixtures (bash + go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      - name: feegrant policy gate regression tests
        run: bash scripts/feegrant-policy-gate-test.sh

      - name: feegrant issuer wrapper regression tests
        run: bash scripts/feegrant-issue-test.sh

      - name: feegrant push recording regression tests
        run: bash scripts/feegrant-record-push-test.sh

      - name: gateway fallback acceptance fixture
        run: bash scripts/gateway-fallback-acceptance.sh

      - name: replication reaper regression fixture
        run: bash scripts/replication-reaper-test.sh

      - name: replication config cutover guard fixture
        run: bash scripts/replication-config-check-test.sh

      - name: contract upgrade scheduling fixture
        run: bash scripts/schedule-upgrade-test.sh

      - name: mainnet governance preflight fixture
        run: bash scripts/mainnet-governance-check-test.sh
